name: Source safety gate
on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tracked source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source guard tests
        run: python3 -m unittest discover -s scripts -p 'test*.py' -v
      - name: Reject runtime artifacts and obvious credentials
        run: python3 scripts/source_guard.py
